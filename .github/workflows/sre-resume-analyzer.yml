name: SRE Resume Analyzer v3

on:
  pull_request:
    paths:
      - ".github/workflows/sre-resume-analyzer.yml"
      - "README.md"
      - "CLAUDE.md"
      - "sre-resume-analyzer/**"
  push:
    paths:
      - ".github/workflows/sre-resume-analyzer.yml"
      - "README.md"
      - "CLAUDE.md"
      - "sre-resume-analyzer/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-quality:
    name: Python 3.13.13
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sre-resume-analyzer
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: sre-resume-analyzer/uv.lock

      - name: Install the pinned Python
        run: uv python install

      - name: Install locked package and development tools
        run: uv sync --frozen --extra dev

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Type check
        run: uv run --frozen mypy src

      - name: Test with coverage gate
        run: >-
          uv run --frozen pytest
          --cov=sre_resume_analyzer
          --cov-report=term-missing
          --cov-report=xml
          --cov-report=json:coverage.json
          --cov-fail-under=85

      - name: Enforce critical-module coverage
        run: uv run --frozen python scripts/check_coverage_gates.py coverage.json

      - name: Audit installed dependencies
        run: |
          uv export \
            --quiet \
            --frozen \
            --no-dev \
            --no-emit-project \
            --format requirements-txt \
            --output-file runtime-requirements.txt
          uv run --frozen pip-audit \
            --disable-pip \
            --no-deps \
            --requirement runtime-requirements.txt

      - name: Static security scan
        run: uv run --frozen bandit -q -r src scripts/finalize_guidance.py -ll

      - name: Build wheel and verify a clean CLI install
        shell: bash
        run: |
          wheel_root="$RUNNER_TEMP/sre-resume-wheel"
          uv build --wheel --out-dir "$wheel_root/dist"
          uv venv --python 3.13.13 "$wheel_root/venv"
          wheel_path="$(find "$wheel_root/dist" -name '*.whl' -print -quit)"
          uv pip install --python "$wheel_root/venv/bin/python" "$wheel_path"
          "$wheel_root/venv/bin/analyze-resume" --help >/dev/null
          "$wheel_root/venv/bin/extract-resume-text" --help >/dev/null
          "$wheel_root/venv/bin/batch-analyze" --help >/dev/null
          "$wheel_root/venv/bin/analyze-resume" \
            --extracted tests/fixtures/runtime_complete.json \
            --output-dir "$wheel_root/output"
          test "$(find "$wheel_root/output/resume_analysis" -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1
          test "$(find "$wheel_root/output/resume_analysis" -type f | wc -l)" -eq 4
          test "$(find "$wheel_root/output/interview_questions" -type f -name '*.md' | wc -l)" -eq 1
          uv run --frozen python tests/create_guidance_smoke_draft.py \
            --deterministic-run "$wheel_root/output" \
            --draft-dir "$wheel_root/drafts"
          uv run --frozen python scripts/finalize_guidance.py \
            --deterministic-run "$wheel_root/output" \
            --draft-dir "$wheel_root/drafts" \
            --output-dir "$wheel_root/enriched" \
            --generator codex
          test "$(find "$wheel_root/enriched/resume_analysis" -type f | wc -l)" -eq 5
          test "$(find "$wheel_root/enriched/deterministic_interview_questions" -type f -name '*.md' | wc -l)" -eq 1
          test -f "$wheel_root/enriched/guidance_manifest.json"
          uv run --frozen python -c 'import json,sys; value=json.load(open(sys.argv[1])); assert value["counts"] == {"total": 1, "llm": 1, "fallback": 0}' "$wheel_root/enriched/guidance_manifest.json"
          candidate_dir="$(find "$wheel_root/output/resume_analysis" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          candidate_name="$(basename "$candidate_dir")"
          deterministic="$wheel_root/enriched/resume_analysis/$candidate_name/deterministic_suggestions.md"
          final="$wheel_root/enriched/resume_analysis/$candidate_name/suggestions.md"
          cmp "$candidate_dir/suggestions.md" "$deterministic"
          uv run --frozen python -c 'import sys; deterministic=open(sys.argv[1],"rb").read(); final=open(sys.argv[2],"rb").read(); heading="# 本地 LLM 个性化增强".encode(); assert final.count(deterministic) == 1; assert final.index(heading) > final.index(deterministic) + len(deterministic)' "$deterministic" "$final"

  skill-surface:
    name: Skill metadata and links
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install the pinned Python
        run: uv python install 3.13.13

      - name: Check out pinned OpenAI skill validator
        uses: actions/checkout@v4
        with:
          repository: openai/skills
          ref: 49f948faa9258a0c61caceaf225e179651397431
          path: .ci/openai-skills

      - name: Validate skill structure
        run: >-
          uv run --isolated --no-project --python 3.13.13 --with 'PyYAML>=6,<7'
          python
          .ci/openai-skills/skills/.system/skill-creator/scripts/quick_validate.py
          sre-resume-analyzer

      - name: Validate local Markdown links
        shell: bash
        run: |
          uv run --isolated --no-project --python 3.13.13 python - <<'PY'
          from pathlib import Path
          import re
          from urllib.parse import unquote

          roots = [Path("README.md"), Path("CLAUDE.md")]
          roots.extend(Path("sre-resume-analyzer").glob("*.md"))
          roots.extend(Path("sre-resume-analyzer/references").glob("*.md"))
          pattern = re.compile(r"(?<!!)\[[^\]]+\]\(([^)]+)\)")
          failures = []

          for document in sorted(roots):
              text = document.read_text(encoding="utf-8")
              for raw_target in pattern.findall(text):
                  target = raw_target.strip().strip("<>").split("#", 1)[0]
                  if not target or target.startswith(("http://", "https://", "mailto:")):
                      continue
                  resolved = (document.parent / unquote(target)).resolve()
                  if not resolved.exists():
                      failures.append(f"{document}: missing {raw_target}")

          if failures:
              raise SystemExit("\n".join(failures))
          print(f"Validated local links in {len(roots)} Markdown files")
          PY
